<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>5天4夜福岡行程示意圖</title>

    <meta name="description"
        content="福岡五天四夜自由行，美食、購物、文化與咖啡之旅。">

    <meta property="og:title"
        content="5天4夜福岡行程示意圖">

    <meta property="og:description"
        content="美食・購物・文化・咖啡之旅">

    <meta property="og:image"
        content="IMG_2262.jpeg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                "Microsoft JhengHei",
                "PingFang TC",
                sans-serif;

            background: #f8f6f2;
            color: #333;
        }

        /* 標題區 */
        .hero {
            background:
                linear-gradient(
                    135deg,
                    #fff7ef,
                    #fff3ea
                );

            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            color: #23395d;
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: #b95e3c;
            font-size: 1.1rem;
        }

        /* 主內容 */
        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px;
        }

        .image-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .trip-image {
            display: block;
            width: 100%;
            height: auto;

            margin: 0 auto;

            border-radius: 12px;
        }

        /* 旅程說明 */
        .description {
            margin-top: 30px;

            background: white;

            border-radius: 20px;

            padding: 25px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .description h2 {
            color: #23395d;
            margin-bottom: 15px;
        }

        .description p {
            line-height: 1.8;
            color: #555;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #888;
            padding: 30px 20px 50px;
        }

        /* 手機版 */
        @media (max-width: 768px) {

            .hero {
                padding: 35px 15px;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .hero p {
                font-size: 0.95rem;
            }

            .container {
                padding: 15px;
            }

            .image-card {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <h1>✈️ 5天4夜福岡行程示意圖</h1>
        <p>美食・購物・文化・咖啡之旅</p>
    </header>

    <main class="container">

       <div class="image-card">
    <img src="IMG_2262.jpeg"
         alt="福岡五天四夜旅行行程圖"
         class="trip-image"></div>
        <section class="highlights">

        <div class="highlight">
            <h3>🍜 美食巡禮</h3>
            <p>
                一蘭拉麵、京都勝牛、
                大東園燒肉、華味鳥水炊鍋。
            </p>
        </div>

        <div class="highlight">
            <h3>⛩ 文化景點</h3>
            <p>
                太宰府天滿宮、
                櫛田神社、
                柳川遊船。
            </p>
        </div>

        <div class="highlight">
            <h3>🛍 購物天堂</h3>
            <p>
                天神商圈、
                博多運河城、
                Lalaport。
            </p>
        </div>

        <div class="highlight">
            <h3>☕ 咖啡探索</h3>
            <p>
                FUK Coffee、
                藍瓶咖啡等特色名店。
            </p>
        </div>

    </section>

</div>

    </main>

    <footer>
        © 2026 Fukuoka Travel Plan
    </footer>

</body>

</html>
