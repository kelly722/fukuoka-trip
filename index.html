<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="福岡5天4夜自由行行程分享">
<meta property="og:title" content="5天4夜福岡行程示意圖">
<meta property="og:description" content="美食、購物、文化、咖啡之旅">
<meta property="og:image" content="IMG_2262.jpeg">

<title>5天4夜福岡行程</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        "Microsoft JhengHei",
        "PingFang TC",
        sans-serif;
    background:#f8f6f2;
    color:#333;
    line-height:1.8;
}

.hero{
    background:linear-gradient(
        135deg,
        #fff7ef,
        #fff3ea
    );
    padding:60px 20px;
    text-align:center;
}

.hero h1{
    font-size:3rem;
    color:#23395d;
    margin-bottom:15px;
}

.hero p{
    font-size:1.2rem;
    color:#b95e3c;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.trip-image{
    width:100%;
    border-radius:15px;
    display:block;
}

.intro{
    margin-top:30px;
    text-align:center;
}

.intro h2{
    margin-bottom:15px;
    color:#23395d;
}

.highlights{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.highlight{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.highlight h3{
    color:#c45c3d;
    margin-bottom:10px;
}

.footer{
    margin-top:50px;
    text-align:center;
    color:#777;
    padding:30px;
}

@media(max-width:768px){

    .hero h1{
        font-size:2rem;
    }

    .hero p{
        font-size:1rem;
    }

}

</style>
</head>

<body>

<header class="hero">
    <h1>✈️ 5天4夜福岡行程示意圖</h1>
    <p>美食・購物・文化・咖啡之旅</p>
</header>

<div class="container">

    <div class="card">
        <img
            src="IMG_2262.jpeg"
            alt="福岡五天四夜旅 <h2>旅程亮點</h2>
        <p>
            福岡自由行結合拉麵、美食、咖啡、購物與文化景點，
            適合首次造訪九州的旅客。
        </p>
    </section>

    <section class="highlights">

        <div class="highlight">
            <h3>🍜 美食巡禮</h3>
            <p>
                一蘭拉麵、京都勝牛、
                大東園燒肉、華味鳥水炊鍋。
            </p>
        </div>

        <div class="highlight">
            <h3>⛩ 文化景點</h3>
            <p>
                太宰府天滿宮、
                櫛田神社、
                柳川遊船。
            </p>
        </div>

        <div class="highlight">
            <h3>🛍 購物天堂</h3>
            <p>
                天神商圈、
                博多運河城、
                Lalaport。
            </p>
        </div>

        <div class="highlight">
            <h3>☕ 咖啡探索</h3>
            <p>
                FUK Coffee、
                藍瓶咖啡等特色名店。
            </p>
        </div>

    </section>

</div>

<footer class="footer">
    <p>
        © 2026 福岡旅行紀錄｜
        GitHub Pages
    </p>
</footer>

</body>
</html>
